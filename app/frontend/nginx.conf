server {
    listen       80;
    server_name  localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — every unknown path renders index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Asset caching
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
