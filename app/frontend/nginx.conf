server {
    listen       80;
    server_name  localhost;

    root /usr/share/nginx/html;
    index index.html;

    # The main bundle is ~2.7 MB raw and ~0.75 MB gzipped: compress text assets on the way out.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml application/wasm;

    # SPA fallback — every unknown path renders index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Asset caching
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
