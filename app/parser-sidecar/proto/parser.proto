syntax = "proto3";

package astra.parser.v1;

// Astra parser sidecar contract.
// Phase A: liveness + echo (smoke test).
// Phase C: real fparser2-backed Parse(SourceFile) → ParseResult.

service Parser {
  // Liveness probe used by the API's /health/ready check.
  rpc Ping(PingRequest) returns (PingReply);

  // Echo a Fortran source string back to the caller. Useful as a
  // round-trip test before fparser2 is wired up.
  rpc EchoSource(EchoSourceRequest) returns (EchoSourceReply);

  // Phase C: real parse. Given a single Fortran source file, return its
  // subroutine inventory + lightweight cross-references (COMMON blocks,
  // called subroutines) so the API can persist real corpora.
  rpc Parse(ParseRequest) returns (ParseResult);

  // Parse a whole corpus in one call. The sidecar materialises the files
  // on disk so cross-file references resolve: a C++ `.cpp` whose class is
  // declared in a sibling header yields its definitions, qualified call
  // targets and shared-state refs, none of which a per-file Parse can
  // see (libclang drops a member definition whose class it never saw).
  // Results come back in request order, one ParseResult per file.
  // Non-C++ files are parsed exactly as Parse would.
  rpc ParseCorpus(ParseCorpusRequest) returns (ParseCorpusReply);

  // ParseCorpus with progress. A proxy in front of the sidecar drops a
  // stream that stays idle (Azure Container Apps ingress: 240 s) and a
  // whole-corpus parse can run longer than that, so this variant sends a
  // progress event as files complete (and at least every 20 s), then
  // exactly one `done` carrying the same reply ParseCorpus would return.
  // Prefer it; fall back to ParseCorpus against an older sidecar.
  rpc ParseCorpusStream(ParseCorpusRequest) returns (stream ParseCorpusEvent);
}

message PingRequest {}
message PingReply {
  string service = 1;
  string version = 2;
  int64 epoch_ms = 3;
}

message EchoSourceRequest {
  string filename = 1;
  string content = 2;
}
message EchoSourceReply {
  string filename = 1;
  int32 line_count = 2;
  int32 byte_length = 3;
}

// ────────────────────────────────────────────────────────────────────
// Phase C: Parse contract
// ────────────────────────────────────────────────────────────────────

message ParseRequest {
  // Display path / filename used by the parser to choose fixed vs free form
  // when `form` is unset (`.f`, `.f77`, `.for` → fixed; `.f90`, `.f95`,
  // `.f03`, `.f08` → free; anything else → caller must set `form`).
  string filename = 1;
  // UTF-8 source text. The sidecar normalises line endings before parsing.
  string content = 2;
  // Optional override: "fixed" | "free". Empty → infer from filename.
  string form = 3;
}

message Subroutine {
  // SUBROUTINE name, uppercased to match Fortran's case-insensitivity.
  string name = 1;
  // Declaration line as written, e.g. "SUBROUTINE CONSUME_ROLL(ROLL_ID, USED_LF, OPER_ID, RESULT_CD)".
  string signature = 2;
  // 1-based inclusive line range covering the SUBROUTINE … END SUBROUTINE block.
  int32 line_start = 3;
  int32 line_end = 4;
  // Names of COMMON blocks referenced inside this subroutine.
  repeated string common_block_refs = 5;
  // Names of subroutines this routine CALLs.
  repeated string called_subroutines = 6;
}

message ParseResult {
  string filename = 1;
  int32 line_count = 2;
  // One entry per SUBROUTINE found. FUNCTIONs and PROGRAMs are out of
  // scope for Phase C; if the file has none of those a partial parse
  // still produces an empty `subroutines` list with `warnings` set.
  repeated Subroutine subroutines = 3;
  // Non-fatal diagnostics — parse fell back to a recovery path, unknown
  // construct skipped, etc. Surfaced verbatim in the API audit row.
  repeated string warnings = 4;
}

// ────────────────────────────────────────────────────────────────────
// Corpus parse contract (additive; Parse stays as it is)
// ────────────────────────────────────────────────────────────────────

message SourceFile {
  // Path relative to the corpus root, forward slashes. It is recreated
  // verbatim under a temporary root so `#include "a/b.hpp"` resolves.
  string filename = 1;
  string content = 2;
}

message ParseCorpusRequest {
  repeated SourceFile files = 1;
  // Optional Fortran form override, as on ParseRequest.
  string form = 2;
}

message ParseCorpusReply {
  // Same order as the request's files.
  repeated ParseResult results = 1;
  // Corpus-level diagnostics (include roots used, fallbacks taken).
  repeated string warnings = 2;
}

message ParseProgress {
  // Files whose routines are known so far (a header harvested from a
  // translation unit counts as soon as that unit is done).
  int32 parsed_files = 1;
  int32 total_files = 2;
  // The file that just completed; empty on a keep-alive tick.
  string current = 3;
}

message ParseCorpusEvent {
  oneof event {
    ParseProgress progress = 1;
    ParseCorpusReply done = 2;
  }
}
