[project]
name = "astra-parser-sidecar"
version = "0.2.0"
description = "Astra RE Harness — Fortran parser sidecar (gRPC + fparser2)."
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.66.0",
    "grpcio-health-checking>=1.66.0",
    "protobuf>=5.27.0",
    # Phase C: real Fortran parsing
    "fparser>=0.1.4",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.66.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["parser_sidecar*"]
